<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow">
    <title>Offline · Core Workspace</title>
    <style>
      body { margin: 0; background: #f7f7f4; color: #252624; font: 1rem/1.5 system-ui, sans-serif; }
      main { max-width: 36rem; margin-inline: auto; padding: 2rem 1.5rem; }
      h1 { line-height: 1.2; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding-inline: 1rem; background: #b82320; color: white; border-radius: 6px; }
      a:focus-visible { outline: 3px solid #b82320; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet, then open the workspace to check your current access. Work, files and approvals require a connection.</p>
      <a href="/">Open workspace</a>
    </main>
  </body>
</html>
